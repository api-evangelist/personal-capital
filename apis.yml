description: 'Personal Capital is a digital wealth management and personal finance company, now operating
  as an Empower company, that pairs free online money-management tools with paid registered-investment-adviser
  services. Its Personal Capital / Empower Personal Dashboard app lets individuals link bank, brokerage,
  retirement, and loan accounts to track net worth, analyze investment fees, plan for retirement, and
  manage cash flow, while Personal Capital Advisors Corporation (an SEC-registered investment adviser)
  offers human financial advisors and managed portfolios for clients who link at least $100,000 in
  investable assets. Personal Capital was acquired by Empower Retirement (Great-West Lifeco / Power
  Corporation) in 2020. The company is consumer-facing and, as of this enrichment pass, does not
  publish a public developer API, OpenAPI, or developer portal.'
